# =============================================================================
# CI — la puerta de calidad de cada cambio
# =============================================================================
# install → lint → typecheck → tests → validación de docs → build → tamaño
#
# Cuándo corre: en cada PR, en cada push a `main` y en cada push a las RAMAS
# LARGAS de desarrollo. Esto último no es cosmético: en el proyecto de origen
# una rama de feature vivió semanas sin CI y tres regresiones de una función
# crítica —una impedía emitir cualquier documento— convivieron dos días sin que
# nada las viera. Una rama donde se desarrolla durante semanas necesita CI
# tanto como la rama a la que se fusiona.
#
# RAMAS LARGAS: se configuran en `on.push.branches` más abajo. Por defecto
# cubre `develop` y cualquier `long/**`; cada proyecto ajusta la lista a su
# forma de trabajar (docs/DEVELOPMENT.md → «Ramas»).
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Ramas largas de desarrollo — personalizar por proyecto.
      - develop
      - "long/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (unitarios, componentes y accesibilidad)
        run: npm run test:run

      - name: Validar public_docs/
        run: npm run docs:validar

      - name: Enlaces de la documentación interna
        run: npm run docs:enlaces

      # BPDF no tiene variables de entorno ni secretos: el build es el mismo en
      # local, en CI y en producción. Es una build estática de Vite (dist/).
      - name: Build
        run: npm run build

      # Lo pesado (pdf.js, KaTeX, Mermaid…) se carga bajo demanda: si algo entra
      # por descuido en el arranque, falla aquí (docs/PLAN.md §11).
      - name: Tamaño del arranque
        run: npm run build:tamano

      # Fase 15: dominio oficial, robots y sitemap, sin URLs de desarrollo ni recursos
      # externos (scripts/lib/dist.mjs). El smoke contra la web publicada NO corre aquí:
      # depende de un despliegue y se lanza a mano (`npm run test:humo`, DEPLOYMENT.md).
      - name: Build publicable
        run: npm run build:verificar

  notify:
    name: Notificar a Discord (opcional)
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Solo si el repo tiene el secreto DISCORD_WEBHOOK. Sin él, el paso no
      # hace nada y el workflow sigue en verde: un proyecto recién creado no
      # debe romperse por no tener notificaciones configuradas.
      - name: Enviar notificación
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ needs.quality.result }}
          AUTHOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK no configurado: sin notificación."
            exit 0
          fi
          case "$STATUS" in
            success)   COLOR=3066993 ; EMOJI="✅" ;;
            failure)   COLOR=15158332; EMOJI="❌" ;;
            cancelled) COLOR=10070709; EMOJI="🚫" ;;
            *)         COLOR=9807270 ; EMOJI="ℹ️" ;;
          esac
          PAYLOAD=$(jq -n \
            --arg title "$EMOJI CI $STATUS — $REPO@$BRANCH" \
            --arg desc  "**Commit:** \`${COMMIT:0:7}\` · **Autor:** $AUTHOR" \
            --arg url   "$RUN_URL" \
            --argjson color "$COLOR" \
            '{embeds:[{title:$title, description:$desc, url:$url, color:$color}]}')
          # Un fallo de Discord no debe poner el workflow en rojo.
          curl -sS -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK" || true
